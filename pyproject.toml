[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safari-bands"
version = "0.1.0"
description = "Stage 1 band design study for the SAFARI cubesat fuel-condition imager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "James", email = "jamesfullum@gmail.com" }]

# Phase 0 needs only config loading and validation.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 1-2: forward model and sensor model.
# numba (via prosail) caps numpy below 2.6 -- see docs/ASSUMPTIONS.md.
sim = [
    "prosail>=2.0.5",
    "numpy>=1.24,<2.6",
    "scipy>=1.11",
]
# Phase 3-5: sensitivity analysis, band selection, retrieval.
analysis = [
    "scikit-learn>=1.4",
    "SALib>=1.5",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
safari-bands = "safari_bands.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
