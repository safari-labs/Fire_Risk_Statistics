# SAFARI configuration A: VNIR + a single SWIR1 band on standard InGaAs.
#
# Brief section 5: the cheapest SWIR option. One standard InGaAs chain, no
# extended-wavelength detector, no deep cooling.
#
# Expected limitation, to be quantified in Phase 4: with only one SWIR band
# there is no SWIR1/SWIR2 contrast, so NDTI/NBR2 and NMDI cannot be formed and
# the dry-matter side of T1 (the conifer spring dip) has little leverage.
# Hypothesis H1 predicts this set is insufficient to resolve Cm changes.
#
# The VNIR set here is provisional; it is optimised in Phase 4.

name: config_a
description: VNIR plus one ~1610 nm SWIR band on standard InGaAs.
role_in_study: candidate
swir_content: "~1610 nm"
detector_class: standard_ingaas

bands:
  - name: blue
    role: BLUE
    centre_nm: 490.0
    fwhm_nm: 40.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: silicon_cmos
  - name: green
    role: GREEN
    centre_nm: 560.0
    fwhm_nm: 35.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: silicon_cmos
  - name: red
    role: RED
    centre_nm: 665.0
    fwhm_nm: 30.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: silicon_cmos
  - name: red_edge1
    role: RED_EDGE1
    centre_nm: 705.0
    fwhm_nm: 20.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: silicon_cmos
  - name: red_edge2
    role: RED_EDGE2
    centre_nm: 740.0
    fwhm_nm: 20.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: silicon_cmos
  - name: nir
    role: NIR
    centre_nm: 865.0
    fwhm_nm: 30.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: silicon_cmos
  - name: swir1
    role: SWIR1
    centre_nm: 1610.0
    fwhm_nm: 90.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: ingaas_std
