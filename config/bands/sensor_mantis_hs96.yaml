# Mantis Hyperspectral — 96 contiguous bands, 470-900 nm.
#
# The third Mantis pushbroom mode (ASSUMPTIONS A-18), and the one that changes
# the question. Generated, not hand-authored: 96 bands at 4.479 nm spacing
# across the published envelope.
#
# THE RANGE IS THE TRADE, NOT THE BAND COUNT
# ------------------------------------------
# HS does not simply beat MS. It buys spectral resolution by giving up
# spectral REACH:
#
#     MS   400-1000 nm   600 nm span    6 bands
#     HS   470- 900 nm   430 nm span   96 bands
#
# HS cannot see below 470 nm or above 900 nm at all. In Sentinel-2 terms that
# removes exactly two bands from the candidate pool -- B1 (443, coastal /
# aerosol) and B9 (945, water vapour) -- leaving eight: B2, B3, B4, B5, B6,
# B7, B8, B8A.
#
# That makes the MS-vs-HS comparison sharp and, unusually, answerable with
# data already on disk. Run the VNIR selection over all ten S2 bands; if B1 or
# B9 earns a place in the best six, HS forfeits something measurable. If
# neither does, HS gives up nothing and its 96 bands are pure gain.
#
# What HS gains is the red edge. 680-780 nm sits comfortably inside 470-900,
# and at 4.5 nm sampling the whole inflection is resolved rather than
# sampled at three points. The brief leans on the red edge for T3 (mortality,
# defoliation), and the three S2 red-edge bands are the part of the VNIR
# argument with the least obvious answer.
#
# WHAT IT COSTS DOWNSTREAM
# ------------------------
# 96 input channels is not 6. Two consequences the study already has
# machinery for:
#   * downlink -- 16x the per-pixel volume of MS, against a budget already
#     being validated;
#   * onboard inference -- the first convolution's width scales with input
#     channels, and stream BRAM is ceil(width_bits/18) x ceil(depth/1024) per
#     stream, so 96 channels widens every inter-layer FIFO. This is precisely
#     the input-channel cost axis in the hardware sweep.
# So HS has to earn its place against 6 bands by more than a little.
#
# FIVE OF THE 96 ARE NOT SURFACE BANDS
# -------------------------------------
# At 4.5 nm spacing, bands near 754, 759, 763, 768 and 772 nm fall inside the
# O2-A absorption. A dispersive sensor covering 470-900 contiguously cannot
# avoid putting detector columns there -- it is a property of the spectrum,
# not a design slip. Those five return no usable surface reflectance and are
# marked purpose: atmospheric, which is also honest about their value: O2-A
# is informative for cloud-top pressure and aerosol height, just not for
# fuel.
#
# So the effective surface count is 91, not 96, and any comparison against
# the 6-band MS mode should say 91.
#
#
# CANONICAL ROLES ARE ASSIGNED TO THE NEAREST BANDS
# -------------------------------------------------
# Six of the 96 carry the standard role names (BLUE, GREEN, RED, RED_EDGE1,
# RED_EDGE2, NIR) rather than HS_nn. That is not a claim that those six are
# special -- it is how the index feasibility matrix is told that a contiguous
# sensor can form NDVI, EVI, VARI and NDRE. With HS_nn names throughout, the
# matrix reported that a 96-band imager could form no index at all, which is
# an artifact of the role vocabulary and not a property of the optics.
#
# A hyperspectral instrument picks whichever channel it needs; these six are
# simply the channels nearest the heritage centres.
# VALIDATOR NOISE IS EXPECTED HERE. Contiguous 4.5 nm bands at 4.5 nm
# FWHM are near-duplicates by the rule's definition, and several fall in the
# O2-A region. For a dispersive hyperspectral sensor that is the design, not
# a defect -- the rule exists to catch wasted slots in a SELECTED set.

name: sensor_mantis_hs96
description: >
  Mantis Hyperspectral, 96 contiguous bands over 470-900 nm. Generated at
  even spacing from the published envelope. The trade against the 6-band
  MS mode is REACH for RESOLUTION: HS cannot see B1 (443) or B9 (945).
role_in_study: candidate
swir_content: "none - VNIR only, and narrower than the MS mode"
detector_class: silicon_cmos
