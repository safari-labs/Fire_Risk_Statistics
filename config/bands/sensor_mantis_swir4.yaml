# Mantis SWIR — the candidate 4-band SWIR pushbroom.
#
# The SWIR half of the two-sensor decision in ASSUMPTIONS A-18. James's
# datasheet extract lists it as one of four modes of a single Mantis imager,
# all in the same <1U envelope at TRL-9:
#
#     Snapshot    RGB or Monochrome
#     Push broom  Multispectral   6x MS bands    400-1000 nm
#     Push broom  Hyperspectral   96x HS bands   470-900 nm
#     Push broom  SWIR            4x SWIR bands  1000-1750 nm
#
# NAMING CORRECTION. This file was first written as "Chameleon SWIR", which
# is Dragonfly's separate 2.5U / 1.6 kg SWIR product and the only public
# listing matching "4 bands, 1000-1750 nm". It is NOT this. Mantis SWIR is a
# mode of the <1U Mantis head, so the platform cost is far lower than the
# Chameleon figures that were in this header -- and the swath and GSD quoted
# from that listing (11.2 km, 8.7 m) do not apply and have been removed
# rather than carried over as plausible-looking wrong numbers.
#
# THE BAND CENTRES BELOW ARE SLOTS, NOT SPECIFICATIONS
# ----------------------------------------------------
# The datasheet gives the envelope and the count, not the placements. That is
# the useful part: the centres look like a design input, which is what this
# study determines. Nothing here is a Mantis specification.
#
# The provisional values respect three constraints:
#   * rule 7's sanctioned windows, 1230-1250 and 1550-1750;
#   * the standard-InGaAs response edge (A-19) -- QE 0.70 at 1650, 0.40 at
#     1700, so a band much past 1700 buys little and sits where the
#     temperature-dependent cutoff makes it least stable;
#   * one band in the short window and three across the 1500-1750 shoulder,
#     giving two water-sensitive regions with different water-to-dry-matter
#     ratios -- hypothesis H1's surviving clause.
#
# PLATFORM COST, for the marginal-value denominator the brief asks for
# --------------------------------------------------------------------
#   <1U, TRL-9, same head as the VNIR modes.
#   GSD and swath: SAME as the MS mode (confirmed by James) -- 32 m and 32 km
#   at 500 km. So the SWIR mode carries no coverage penalty.
#
# Confirmed: MS and SWIR run SIMULTANEOUSLY, split by a dichroic on a shared
# fore-optic -- SWIR reflected at 90 degrees, VNIR transmitted. So the SWIR
# mode is not an alternative to the MS mode and "both" is the default
# configuration rather than a doubling of the payload. See ASSUMPTIONS A-20.
#
# One consequence for the short end: the dichroic crossover near 1000 nm
# bounds how blue a SWIR band can sit. The 1240 nm slot is comfortably clear;
# a band nearer 1000 would land in the transition.

name: sensor_mantis_swir4
description: >
  Mantis SWIR, the candidate 4-band SWIR pushbroom mode (1000-1750
  nm). BAND CENTRES ARE PROVISIONAL SLOTS chosen to respect rule 7 and the
  InGaAs response edge — the vendor publishes only the envelope, and the
  placements are what this study is meant to determine.
role_in_study: candidate
swir_content: "4 bands in 1000-1750 nm, centres TBD by this study"
detector_class: ingaas_std

bands:
  # Short window. 1240 rather than WorldView-3's 1209: liquid water
  # absorption rises through this region so 1240 is the more sensitive
  # choice, and 1230-1250 still clears the O2 band at 1270 by ~20 nm. The
  # 1209-vs-1240 trade is itself a question for the study.
  - name: swir_1240
    role: SWIR_SHORT
    centre_nm: 1240.0
    fwhm_nm: 20.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: ingaas_std
  # Shoulder, low. Respaced from 1575 to 1550: at 40 nm FWHM, 1575 and
  # 1610 overlap enough that the validator calls them near-duplicates,
  # and spending two of only four slots on the same measurement is the
  # most expensive mistake available here.
  - name: swir_1550
    role: SWIR1_LOW
    centre_nm: 1550.0
    fwhm_nm: 40.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: ingaas_std
  # Heritage placement: Sentinel-2 B11 and Landsat OLI B6 both sit here, so
  # keeping one band at 1610 buys cross-calibration and lets the archive be
  # used for this band specifically under rule 2.
  - name: swir_1610
    role: SWIR1_MID
    centre_nm: 1610.0
    fwhm_nm: 40.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: ingaas_std
  # Shoulder, high. Pulled to 1680 rather than WV-3's 1730 to stay inside
  # the standard-InGaAs response, where the modelled QE at 1730 is a small
  # fraction of the plateau.
  #
  # 1680 is also half of NDLI, the lignin index, whose other band is 1754
  # nm -- past both the 1700 cutoff and the 1750 envelope. That pairing is
  # the ONLY in-range route to T2 (curing / NPV), because the brief's 2100
  # nm cellulose route needs a SWIR2 this sensor does not reach. So this
  # slot is half of a measurement whose other half is currently out of
  # reach, which is the sharpest form of the extended-detector question.
  # See OPEN_QUESTIONS Q23.
  - name: swir_1680
    role: SWIR1_HIGH
    centre_nm: 1680.0
    fwhm_nm: 40.0
    srf_shape: gaussian
    out_of_band_leakage: 0.01
    detector: ingaas_std
