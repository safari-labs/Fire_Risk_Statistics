# MS + SWIR together: the 10-band combined Mantis configuration.
#
# Generated by merging sensor_mantis_vnir6.yaml and sensor_mantis_swir4.yaml,
# so the centres carry the same caveat -- SLOTS the study fills, not vendor
# specifications.
#
# THIS IS THE DEFAULT, NOT AN EXPENSIVE UPGRADE
# ---------------------------------------------
# Confirmed by James: MS and SWIR run SIMULTANEOUSLY on one head, split by a
# dichroic on a shared fore-optic -- SWIR reflected at 90 degrees onto the
# InGaAs plane, VNIR transmitted to the silicon one. Same GSD, same swath.
#
# Two earlier arguments in this file are withdrawn as a result.
#
# The MISREGISTRATION penalty. An earlier header insisted this set be scored
# with a misregistration term because NDMI, NDII and NMDI contrast NIR
# against SWIR, so cross-chain error would land on exactly the products the
# SWIR mode is carried for. That holds for two separate telescopes. With a
# shared aperture both chains see the same scene through the same optics at
# the same instant, so registration is an alignment and thermal-stability
# problem on one bench -- a tolerance to specify in Phase 5, not a penalty
# that could disqualify the option.
#
# The SWATH penalty. That came from mis-identifying the SWIR mode as
# Dragonfly's Chameleon SWIR (11.2 km against Mantis's 32 km). Same head,
# same swath. Withdrawn entirely.
#
# WHAT THE DICHROIC INTRODUCES INSTEAD
# ------------------------------------
# A dichroic edge is a transition, not a step. With the split near 1000 nm,
# B9 (945 nm) would sit within ~50 nm of the crossover, so its transmission
# depends on where the edge is placed and how steep it is. B9 is also one of
# the two bands that separates the MS mode from HS (A-18), so if the VNIR
# selection wants it, the dichroic specification becomes coupled to that
# result. The SWIR chain's short end is bounded by the same transition; the
# 1240 nm slot is comfortably clear, a band nearer 1000 would not be.
#
# Both chains also lose a few percent of throughput to the dichroic, which
# belongs in the SNR budget rather than being assumed away.
#
# See ASSUMPTIONS A-20.

name: sensor_mantis_ms_plus_swir
description: Mantis MS + SWIR together, 6 VNIR + 4 SWIR. Centres are provisional
  slots. Whether the two modes run simultaneously on one head is unconfirmed and
  decides what this option costs.
role_in_study: candidate
swir_content: 4 bands in 1000-1750 nm, centres TBD by this study
detector_class: silicon_cmos + ingaas_std
bands:
- name: blue
  role: BLUE
  centre_nm: 490.0
  fwhm_nm: 65.0
  srf_shape: gaussian
  out_of_band_leakage: 0.01
  detector: silicon_cmos
- name: green
  role: GREEN
  centre_nm: 560.0
  fwhm_nm: 35.0
