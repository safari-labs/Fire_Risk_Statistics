# MS + SWIR together: the 10-band combined Mantis option.
#
# Generated by merging sensor_mantis_vnir6.yaml and sensor_mantis_swir4.yaml,
# so the centres carry the same caveat -- SLOTS the study fills, not vendor
# specifications.
#
# THE FIRST THING TO CONFIRM
# --------------------------
# All four Mantis modes are modes of ONE <1U head. Whether MS and SWIR can run
# SIMULTANEOUSLY, or are alternative configurations selected per acquisition,
# decides whether this set exists at all. If they are alternatives, "both"
# means two Mantis units, and the cost is two of everything. If they are
# simultaneous, "both" is nearly free and this is simply the default.
#
# This replaces an earlier version of this file built from Dragonfly's
# Chameleon SWIR (2.5U, 1.6 kg, 11.2 km swath), which is a different product
# and gave the "both" option a cost and a swath penalty that do not apply to
# a single Mantis head. Those numbers were removed rather than adjusted.
#
# WHAT STILL NEEDS CHECKING, whichever way that goes
# ---------------------------------------------------
#   * registration -- pushbroom MS and pushbroom SWIR are different focal
#     planes whether or not they share a housing, and the brief flags
#     VNIR/SWIR band-to-band registration at snow/forest boundaries as an
#     engineering risk. NDMI, NDII and NMDI all contrast NIR against SWIR, so
#     the cross-chain error lands on exactly the products the SWIR mode is
#     carried for. Score this set WITH a misregistration term.
#   * GSD -- the MS mode is 32 m at 500 km; the SWIR mode's GSD is not in the
#     extract. A cross-sensor index needs a stated resampling convention.
#   * downlink -- 10 bands against 6, against a budget already being
#     validated.

name: sensor_mantis_ms_plus_swir
description: Mantis MS + SWIR together, 6 VNIR + 4 SWIR. Centres are provisional
  slots. Whether the two modes run simultaneously on one head is unconfirmed and
  decides what this option costs.
role_in_study: candidate
swir_content: 4 bands in 1000-1750 nm, centres TBD by this study
detector_class: silicon_cmos + ingaas_std
bands:
- name: blue
  role: BLUE
  centre_nm: 490.0
  fwhm_nm: 65.0
  srf_shape: gaussian
  out_of_band_leakage: 0.01
  detector: silicon_cmos
- name: green
  role: GREEN
  centre_nm: 560.0
  fwhm_nm: 35.0
  srf_shape: gaussian
  out_of_band_leakage: 0.01
  detector: silicon_cmos
- name: red
  role: RED
  centre_nm: 665.0
